# Please refer to https://github.com/mozilla-mobile/firefox-android/blob/main/android-components/config/detekt.yml
# for the source of truth for our detekt configuration.

build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    # complexity: 2
    # LongParameterList: 1
    # style: 1
    # comments: 1

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false
  # when writing own rules with new properties, exclude the property path e.g.: 'my_rule_set,.*>.*>[my_property]'
  excludes: ''

processors:
  active: true
  exclude:
    - 'DetektProgressListener'
  # - 'KtFileCountProcessor'
  # - 'PackageCountProcessor'
  # - 'ClassCountProcessor'
  # - 'FunctionCountProcessor'
  # - 'PropertyCountProcessor'
  # - 'ProjectComplexityProcessor'
  # - 'ProjectCognitiveComplexityProcessor'
  # - 'ProjectLLOCProcessor'
  # - 'ProjectCLOCProcessor'
  # - 'ProjectLOCProcessor'
  # - 'ProjectSLOCProcessor'
  # - 'LicenseHeaderLoaderExtension'

console-reports:
  active: true
  exclude:
  #  - 'ProjectStatisticsReport'
  #  - 'ComplexityReport'
  #  - 'NotificationReport'
  #  - 'FindingsReport'
  #  - 'FileBasedFindingsReport'
  #  - 'LiteFindingsReport'

output-reports:
  active: true
  exclude:
  # - 'TxtOutputReport'
  # - 'XmlOutputReport'
  # - 'HtmlOutputReport'
  # - 'MdOutputReport'
  # - 'SarifOutputReport'

# Custom Rules

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: true
    licenseTemplateFile: 'license.template'
    licenseTemplateIsRegex: false

mozilla-detekt-rules:
  active: true
  MozillaBannedPropertyAccess:
    active: true
    # BuildConfig.Debug: This property tests whether the application was built
    # with the debuggable flag or not. Use a check for different build variants,
    # instead.
    bannedProperties: 'BuildConfig.DEBUG'
  MozillaModularization:
    active: true
    classes:
        - includePackage: 'org.mozilla.fenix..'
        - excludeClass: '.*FragmentDirections.*'
    warning:
      - includeClass: 'org\.mozilla\.fenix\.R.*'
    sets:
      theme:
        - includePackage: 'org.mozilla.fenix.theme..'
      downloads:
        - includePackage: 'org.mozilla.fenix.downloads..'
        - includeClass: 'org.mozilla.fenix.GleanMetrics.Downloads'
      iconpicker:
        - includePackage: 'org.mozilla.fenix.iconpicker..'
        - includeClass: 'org.mozilla.fenix.GleanMetrics.AppIconSelection'
      microsurvey:
        - includePackage: 'org.mozilla.fenix.microsurvey..'
      reviewprompt:
        - includePackage: 'org.mozilla.fenix.reviewprompt..'
        - includeClass: 'org.mozilla.fenix.GleanMetrics.CustomReviewPrompt'
      startupCrash:
        - includePackage: 'org.mozilla.fenix.startupCrash..'
    layers:
      application:
        - <rest>
      modules:
        - downloads
        - iconpicker
        - microsurvey
        - reviewprompt
        - startupCrash
      base:
        - theme
